name: apree-workspace
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apree_local}
      POSTGRES_DB: ${POSTGRES_DB:-apree}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apree}:${POSTGRES_PASSWORD:-apree_local}@db:5432/${POSTGRES_DB:-apree}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    command: ["node", "apps/api/dist/src/main.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apree}:${POSTGRES_PASSWORD:-apree_local}@db:5432/${POSTGRES_DB:-apree}
      API_HOST: 0.0.0.0
      API_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  web:
    build: .
    command: ["npm", "run", "start", "-w", "@apree/web"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
